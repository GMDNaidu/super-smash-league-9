<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Smash League 9.0 · IIM Rohtak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a15;--bg2:#0b1224;--card:#0f1830;--card2:#131f3d;--line:#1f2d52;--gold:#f4c24f;--gold2:#ffe39a;--red:#ff3d4d;--green:#2fd78c;--blue:#4c8dff;--txt:#eef2ff;--mut:#8d9ac0;--disp:'Bebas Neue',Impact,sans-serif;--body:'Outfit',system-ui,sans-serif;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden;
background-image:radial-gradient(900px 500px at 85% -10%,rgba(244,194,79,.13),transparent 60%),radial-gradient(800px 600px at -10% 10%,rgba(76,141,255,.12),transparent 55%),radial-gradient(700px 500px at 50% 110%,rgba(255,61,77,.10),transparent 60%);background-attachment:fixed}
body.modal-open{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--txt);background:#0a1226;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
a{color:inherit;text-decoration:none}
.mut{color:var(--mut)}.dim{opacity:.8}.center{text-align:center}.sm2{font-size:.82rem}.pad{padding:18px}.pad2{padding:6px 16px}.rd{color:var(--red)}.gd{color:var(--gold)}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(6,10,21,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:18px}
.brand{font-family:var(--disp);font-size:1.55rem;letter-spacing:.04em;line-height:1;display:flex;align-items:center;gap:10px}
.brand b{color:var(--gold)}.brand small{display:block;font:500 .6rem var(--body);letter-spacing:.2em;color:var(--mut);text-transform:uppercase;margin-top:2px}
.ball{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff6a6a,#b3121f 60%,#6d0710);box-shadow:0 0 14px rgba(255,61,77,.5);position:relative;flex:none}
.ball:before{content:"";position:absolute;inset:3px 12px;border-left:1.5px dashed rgba(255,255,255,.7);border-right:1.5px dashed rgba(255,255,255,.7)}
.links{display:flex;gap:4px;margin-left:auto}
.links a{padding:9px 16px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--mut);transition:.2s;display:flex;align-items:center;gap:7px;white-space:nowrap}
.links a:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.links a.on{color:#1a1200;background:linear-gradient(135deg,var(--gold2),var(--gold))}
.links a.pulse:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,61,77,.7);animation:pl 1.4s infinite}
.link{font-size:.7rem;font-weight:600;padding:4px 9px;border-radius:999px;display:flex;align-items:center;gap:5px;border:1px solid var(--line);color:var(--mut)}
.link:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.link.ok{color:var(--green)}.link.off{color:#ff9a4d}.link.wait{color:var(--mut)}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(255,61,77,0)}100%{box-shadow:0 0 0 0 rgba(255,61,77,0)}}
.wrap{max-width:1180px;margin:0 auto;padding:6px 18px 30px}.wrap.top{padding-top:26px}
/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 46px,rgba(255,255,255,.025) 46px 48px);mask-image:linear-gradient(#000,transparent)}
.hero:after{content:"";position:absolute;left:50%;top:-120px;width:620px;height:620px;transform:translateX(-50%);background:radial-gradient(circle,rgba(244,194,79,.22),transparent 65%);pointer-events:none}
.hero-in{position:relative;max-width:1180px;margin:0 auto;padding:54px 18px 46px;text-align:center}
.eyebrow{display:inline-block;font-weight:700;font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);padding:7px 16px;border:1px solid rgba(244,194,79,.4);border-radius:999px;background:rgba(244,194,79,.07)}
h1{font-family:var(--disp);font-weight:400;font-size:clamp(3.3rem,10vw,7.2rem);line-height:.92;letter-spacing:.015em;margin:20px 0 10px;text-transform:uppercase}
h1 em{font-style:normal;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#c98a10);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .v{color:var(--red);-webkit-text-stroke:0;text-shadow:0 0 30px rgba(255,61,77,.5)}
.sub{color:var(--mut);font-size:1.1rem}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}
.pills span{padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:.82rem;font-weight:500}
.nsc{width:36px;height:36px;object-fit:contain;flex:none}.hsc{width:132px;height:132px;object-fit:contain;display:block;margin:0 auto 14px;filter:drop-shadow(0 0 22px rgba(244,194,79,.35))}.fsc{width:76px;height:76px;object-fit:contain;opacity:.9;margin-bottom:8px}
@media(max-width:700px){.nsc{width:30px;height:30px}.hsc{width:100px;height:100px}.brand .ball{display:none}}
/* headings */
.sh{font-family:var(--disp);font-weight:400;font-size:2rem;letter-spacing:.06em;margin:34px 0 14px;display:flex;align-items:center;gap:12px}
.sh:after{content:"";height:2px;flex:1;background:linear-gradient(90deg,var(--line),transparent)}
.sh.big{font-size:2.5rem}
.gh{font-family:var(--disp);font-weight:400;font-size:1.35rem;letter-spacing:.08em;margin:22px 0 12px;display:flex;align-items:center;gap:10px}.gh.mt{margin-top:30px}
.dot{width:12px;height:12px;border-radius:3px;transform:rotate(45deg);display:inline-block}.dot.a{background:var(--blue)}.dot.b{background:var(--green)}.dot.k{background:var(--gold)}.dot.f{background:var(--red)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.chip.sm{font-size:.62rem;padding:3px 8px}
.chip.live{background:rgba(255,61,77,.16);color:#ff7a86;border:1px solid rgba(255,61,77,.45)}.chip.live i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pl 1.2s infinite}
.chip.ft{background:rgba(47,215,140,.12);color:var(--green);border:1px solid rgba(47,215,140,.3)}
.chip.up{background:rgba(255,255,255,.06);color:var(--mut);border:1px solid var(--line)}
/* team strip */
.lg{border-radius:14px;object-fit:cover;flex:none;background:#0a1226;display:inline-block}.lg.ph{display:inline-grid;place-items:center;color:var(--mut);font-weight:800;border:2px dashed var(--line);font-size:1.1rem}
.teams{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.tcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px 14px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);transition:.25s;position:relative;overflow:hidden;text-align:center}
.tcard:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.tcard:hover{transform:translateY(-5px);border-color:var(--c);box-shadow:0 14px 34px -14px var(--c)}
.tcard b{font-family:var(--disp);font-weight:400;font-size:1.3rem;letter-spacing:.05em;line-height:1.05}.tcard small{color:var(--mut);font-size:.72rem}
/* fixtures */
.fxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}.fxg.one{grid-template-columns:minmax(0,560px)}
.fxc{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.22s;position:relative;overflow:hidden}
.fxc:hover{transform:translateY(-3px);border-color:#3a5192}
.fxc.live{border-color:rgba(255,61,77,.55);box-shadow:0 0 0 1px rgba(255,61,77,.25),0 10px 34px -12px rgba(255,61,77,.4)}
.fxh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.stg{font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.fxm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}.tn{font-weight:600;font-size:.95rem;line-height:1.15}
.tm.win .tn{color:var(--gold)}.tm.win .lg{box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(244,194,79,.45)}
.sc{min-height:34px;display:flex;flex-direction:column;align-items:center}.sc b{font-family:var(--disp);font-weight:400;font-size:1.7rem;letter-spacing:.04em;line-height:1}.sc small{color:var(--mut);font-size:.72rem}
.vs{font-family:var(--disp);color:var(--mut);font-size:1.1rem;letter-spacing:.1em}.vs.big{font-size:1.8rem}
.fxf{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:3px;font-size:.82rem;text-align:center}
.res{color:var(--gold);font-weight:600}.res.live{color:#ff7a86}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px;padding:14px 18px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,61,77,.18),rgba(255,61,77,.04));border:1px solid rgba(255,61,77,.4);cursor:pointer}.banner .go{margin-left:auto;color:var(--gold);font-weight:700}
.sched{padding:6px 0 10px}.sd{font-family:var(--disp);letter-spacing:.08em;font-size:1.2rem;color:var(--gold);padding:14px 18px 6px}
.sr{display:grid;grid-template-columns:190px 1fr auto auto;gap:14px;align-items:center;padding:11px 18px;border-top:1px solid rgba(31,45,82,.6);cursor:pointer;transition:.15s}.sr:hover{background:rgba(255,255,255,.04)}
.stm{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.stn{font-weight:600}.stn i{color:var(--mut);font-style:normal;font-size:.8rem;margin:0 4px}.ssg{color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
@media(max-width:700px){.sr{grid-template-columns:1fr auto;gap:4px 10px;padding:11px 14px}.stm{grid-column:1/3;color:var(--gold);font-size:.82rem}.ssg{display:none}}
/* cards, tables */
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:6px 6px;margin-bottom:16px}
.card.pad{padding:18px}.card .gh{padding:0 14px}.card.pad .gh{padding:0}.tw{overflow-x:auto}.tw>.t{min-width:100%}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.g2 .card{padding:10px 8px 12px}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.t th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:9px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.t td{padding:10px 8px;text-align:center;border-bottom:1px solid rgba(31,45,82,.6);white-space:nowrap}.t tr:last-child td{border-bottom:0}
.t th.l,.t td.l,.t td.nm{text-align:left}.t td.nm{font-weight:500}
.t tr.q td:first-child{box-shadow:inset 3px 0 0 var(--green)}.t tr.q{background:linear-gradient(90deg,rgba(47,215,140,.07),transparent 50%)}
.tc{display:inline-flex;align-items:center;gap:10px;font-weight:600}.tc .lg{border-radius:8px}
.pts{color:var(--gold);font-size:1.1rem}.star{color:var(--gold);font-weight:800}
.fm{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font:700 .65rem var(--body);font-style:normal;margin-left:3px}.fm.W{background:rgba(47,215,140,.2);color:var(--green)}.fm.L{background:rgba(255,61,77,.2);color:#ff7a86}.fm.T,.fm.N{background:rgba(255,255,255,.1);color:var(--mut)}
.note{padding:10px 14px 4px;font-size:.76rem;color:var(--mut)}.qd{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--green);margin-right:4px;vertical-align:-1px}
tr.ex td,tr.tot td{color:var(--mut);font-size:.85rem}tr.tot td{color:var(--txt);font-weight:600;border-top:1px solid var(--line)}tr.ex td:first-child,tr.tot td:first-child{text-align:left}tr.ex td:last-child,tr.tot td:last-child{text-align:left}
.rl{font-size:.7rem;padding:3px 9px;border-radius:999px;font-weight:600}.rl.AR{background:rgba(244,194,79,.15);color:var(--gold)}.rl.BAT{background:rgba(76,141,255,.15);color:#7fb0ff}.rl.BOWL{background:rgba(255,61,77,.15);color:#ff7a86}
/* bracket */
.bk{display:flex;align-items:center;justify-content:center;gap:18px;padding:12px;flex-wrap:wrap}.bkc{display:flex;flex-direction:column;gap:12px}.bkl{font-family:var(--disp);font-size:2.2rem;color:var(--gold)}
.bkm{width:250px;background:#0a1226;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.2s}.bkm:hover{border-color:var(--gold)}.bkm small{display:block;color:var(--mut);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.bkt{display:flex;align-items:center;gap:9px;padding:4px 0;font-weight:500;font-size:.9rem}.bkt.w{color:var(--gold);font-weight:700}.bkt .lg{border-radius:6px}
/* leaders */
.leads{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:8px}
.lead{border-radius:var(--r);padding:16px;position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,var(--card2),var(--card));min-height:158px}
.lead:before{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:var(--ac,#fff);opacity:.14;filter:blur(2px)}
.lead small{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ac,var(--mut))}
.lead.orange{--ac:#ff9f1c}.lead.purple{--ac:#b388ff}.lead.gold{--ac:var(--gold)}.lead.blue{--ac:var(--blue)}.lead.red{--ac:var(--red)}.lead.green{--ac:var(--green)}.lead.teal{--ac:#33d1d1}.lead.pink{--ac:#ff6fb5}
.lp{display:flex;align-items:center;gap:10px;margin:12px 0 4px}.lp b{display:block;font-size:1rem;line-height:1.1}.lp span{font-size:.76rem;color:var(--mut)}
.lv{font-family:var(--disp);font-size:3.2rem;line-height:1;color:var(--ac);letter-spacing:.03em}.lv.dash{color:var(--line)}.lead em{font-style:normal;font-size:.76rem;color:var(--mut)}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}.rec small{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.rec b{font-family:var(--disp);font-weight:400;font-size:1.9rem;color:var(--gold);letter-spacing:.03em}.rec span{font-size:.8rem;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin:18px 0 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:9px 18px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--mut);background:rgba(255,255,255,.04);border:1px solid var(--line);white-space:nowrap;transition:.2s}.tabs button.on{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.empty{text-align:center;padding:50px 20px;border:2px dashed var(--line);border-radius:var(--r);color:var(--mut)}.empty .em,.lock .em{font-size:3rem;margin-bottom:8px}.empty b{color:var(--txt);font-size:1.1rem}
/* live */
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.mc{flex:none;padding:10px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;font-weight:600;font-size:.88rem;display:flex;flex-direction:column;gap:2px;position:relative}.mc small{font-weight:400;color:var(--mut);font-size:.72rem}.mc.on{border-color:var(--gold);background:linear-gradient(180deg,#1b2850,var(--card));box-shadow:0 0 0 1px var(--gold)}
.ld{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--red);animation:pl 1.2s infinite}
.sb{margin-top:10px;border-radius:22px;border:1px solid var(--line);padding:20px;background:radial-gradient(600px 240px at 50% 0,rgba(244,194,79,.12),transparent 70%),linear-gradient(180deg,#14214a,#0b1330);position:relative;overflow:hidden}
.sbt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.8rem;font-weight:600;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.sbm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:18px 0 12px}
.sbteam{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:600}.sbteam.bat b{font-family:var(--disp);font-weight:400;font-size:1.5rem;letter-spacing:.05em}.sbteam .lg{border-radius:18px}
.sbs{text-align:center}.runs{font-family:var(--disp);font-size:clamp(4rem,12vw,6.5rem);line-height:.9;color:var(--gold2);letter-spacing:.02em;text-shadow:0 0 36px rgba(244,194,79,.35)}.runs span{color:var(--mut);font-size:.55em}
.ovl{font-size:1.15rem;font-weight:600}.ovl small{color:var(--mut)}.crr{font-size:.8rem;color:var(--mut)}
.resb{margin:12px 0;padding:11px 16px;border-radius:12px;background:rgba(244,194,79,.1);border:1px solid rgba(244,194,79,.3);color:var(--gold2);text-align:center;font-weight:600}.resb.chase{background:rgba(76,141,255,.1);border-color:rgba(76,141,255,.4);color:#a9c8ff}.resb.dim{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--mut);font-weight:400}
.mom{margin:12px 0;text-align:center;padding:10px;border-radius:12px;background:rgba(255,111,181,.1);border:1px solid rgba(255,111,181,.3)}
.now{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:8px;background:rgba(0,0,0,.2);border-radius:14px;padding:6px 6px 14px}.bwl{padding:12px 10px;display:flex;flex-direction:column;gap:10px}.bwl b{font-size:1.05rem;margin-right:6px}.bwl small{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
.bubs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}.bubs.big{margin:12px 0}.bubs.big .bb{width:40px;height:40px;font-size:.95rem}
.bb{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 5px;border-radius:50%;font:700 .78rem var(--body);font-style:normal;background:#1a2748;border:1px solid var(--line)}
.bb.s4{background:rgba(76,141,255,.25);border-color:var(--blue);color:#9cc2ff}.bb.s6{background:rgba(244,194,79,.25);border-color:var(--gold);color:var(--gold2)}.bb.w{background:var(--red);border-color:var(--red);color:#fff}.bb.x{background:rgba(255,159,28,.2);border-color:#ff9f1c;color:#ffc46b;border-radius:14px}.bb.dot{color:var(--mut)}
.fhit{font-style:normal;font-weight:800;font-size:.7rem;padding:5px 10px;border-radius:999px;background:var(--green);color:#022;letter-spacing:.1em;animation:pl 1.4s infinite}
.pship{font-size:.82rem}
.inn{padding:10px 8px 18px}.inn+.inn{border-top:2px solid var(--line)}.inn-h{display:flex;align-items:center;gap:12px;padding:6px 10px 10px;flex-wrap:wrap}.inn-h .big{font-family:var(--disp);font-size:2rem;color:var(--gold);letter-spacing:.04em;margin-left:auto}.inn-h .lg{border-radius:8px}
.cm-h{font-family:var(--disp);letter-spacing:.08em;font-size:1.2rem;padding:14px 16px 6px;color:var(--gold)}
.cm{display:grid;grid-template-columns:44px 40px 1fr;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(31,45,82,.6)}.cm .o{color:var(--mut);font-size:.82rem;font-variant-numeric:tabular-nums}.cm p{font-size:.9rem}.cm:last-child{border:0}
.ovr{display:grid;grid-template-columns:70px 1fr auto;gap:6px 12px;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(31,45,82,.6)}.ovr .bubs{grid-column:1/3}.ovr em{font-style:normal;color:var(--gold);font-weight:700;grid-row:1/3;grid-column:3}.ovr b{font-family:var(--disp);font-weight:400;font-size:1.1rem;letter-spacing:.06em}
/* control */
.ctl-h{display:flex;flex-direction:column;gap:6px}.warn{background:rgba(255,154,77,.12);border:1px solid rgba(255,154,77,.4);color:#ffc08a;padding:10px 14px;border-radius:12px;font-size:.85rem;margin:4px 0}
.row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.row label{font-size:.76rem;font-weight:600;color:var(--mut);letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.form{max-width:520px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;padding:0 4px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px}.btns.c{justify-content:center}.btns.end{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line)}
.btn{padding:11px 20px;border-radius:12px;font-weight:700;font-size:.9rem;background:#1b2850;border:1px solid #2b3d70;transition:.15s}.btn:hover{background:#243569;transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1200;border:0}.btn.red{background:var(--red);border:0;color:#fff}.btn.ghost{background:transparent}.btn.sm{padding:6px 12px;font-size:.78rem}
.ctl-m{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.ctl-m b{font-family:var(--disp);font-weight:400;font-size:1.4rem;letter-spacing:.05em}
.spad{max-width:680px;margin:0 auto}.sp-top{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:baseline}.sp-sc{font-size:1.1rem}.sp-sc b{font-family:var(--disp);font-size:2.2rem;font-weight:400;color:var(--gold);letter-spacing:.04em}.tg{color:#a9c8ff;font-weight:600;font-size:.9rem}
.sp-pl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.sp-pl>div{background:#0a1226;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.sp-pl small{display:block;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.sp-pl b{display:block;font-size:.95rem}.sp-pl span{color:var(--gold);font-weight:600;font-size:.85rem}
.xr{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}.xr button{padding:9px 16px;border-radius:999px;font-weight:600;font-size:.86rem;background:#0a1226;border:1px solid var(--line)}.xr button.on{background:#ff9f1c;color:#2a1700;border-color:#ff9f1c}
.runs-r{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.rb{aspect-ratio:1;border-radius:16px;font-family:var(--disp);font-size:2rem;background:#16234a;border:1px solid #2b3d70;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:.12s}.rb small{font:600 .55rem var(--body);color:var(--mut);margin-top:2px}.rb:active{transform:scale(.92)}.rb:hover{background:#1f3068}
.rb.r4{background:rgba(76,141,255,.25);border-color:var(--blue)}.rb.r6{background:rgba(244,194,79,.25);border-color:var(--gold);color:var(--gold2)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.acts .btn.red{flex:1;min-width:140px;font-size:1.1rem;padding:15px}
.fe{margin:0 0 14px}.fe-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.fe-h b{font-family:var(--disp);font-weight:400;font-size:1.3rem;letter-spacing:.06em}
.ta{font:.74rem/1.4 ui-monospace,monospace;margin:8px 0;resize:vertical}.lock{text-align:center;padding:70px 20px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:center}.lock a{display:inline-block;margin-top:10px}
.mrow{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:10px}
/* modal */
.ov{position:fixed;inset:0;z-index:100;background:rgba(2,5,14,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;overflow-y:auto;animation:fi .2s}
.modal{width:min(780px,100%);max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#14214a,#0c1530);border:1px solid #2b3d70;border-radius:22px;padding:24px 18px 18px;position:relative;animation:up .25s}
.modal h2{font-family:var(--disp);font-weight:400;letter-spacing:.07em;font-size:1.9rem;margin-bottom:10px}
.x{position:absolute;right:14px;top:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);font-size:1.4rem;line-height:1}
.mh{display:flex;gap:18px;align-items:center;padding:0 6px 16px;flex-wrap:wrap}.mh .lg{border-radius:20px}.mh h2{margin:0}.tagl{color:var(--gold);font-style:italic;margin:4px 0}.mm{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;font-family:var(--disp);font-size:1.7rem;letter-spacing:.05em}.mm b{font-weight:400}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(24px);opacity:0}}
#toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,30px);background:#fff;color:#111;padding:11px 20px;border-radius:12px;font-weight:600;font-size:.88rem;opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:30px 18px 100px;border-top:1px solid var(--line);margin-top:30px}footer b{color:var(--gold)}footer a{color:var(--mut);text-decoration:underline;text-underline-offset:3px}footer a:hover{color:var(--gold)}
.hm{}
@media(max-width:900px){.teams{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr}.now{grid-template-columns:1fr}}
@media(max-width:700px){
.nav-in{padding:10px 14px}.brand small{display:none}.brand{font-size:1.3rem}.link{margin-left:auto}
.links{position:fixed;left:10px;right:10px;bottom:10px;margin:0;background:rgba(11,18,36,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:5px;justify-content:space-between;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.links a{flex:1;justify-content:center;padding:11px 6px;font-size:.8rem}.links a .lk-ic{display:none}
.wrap{padding:6px 12px 24px}.fxg{grid-template-columns:1fr}.teams{grid-template-columns:repeat(2,1fr)}.hero-in{padding:38px 14px 34px}
.hm{display:none}.t th,.t td{padding:9px 5px}.t{font-size:.82rem}.sh{font-size:1.6rem}.sh.big{font-size:2rem}
.runs-r{gap:6px}.rb{border-radius:12px;font-size:1.6rem}.sp-pl{grid-template-columns:1fr 1fr}.sp-pl>div:last-child{grid-column:1/3}.sbm{gap:6px}.sbteam .lg{width:60px!important;height:60px!important}.mrow{grid-template-columns:1fr 1fr 1fr}.mrow b{grid-column:1/4}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ===== Super Smash League 9.0 — pure scoring / standings / stats engine ===== */
const SET0 = { wide: 1, nb: 1, bpo: 6, win: 2, tie: 1, nr: 1, overs: 5, maxWkts: 7 };

function ovStr(legal, bpo) { bpo = bpo || 6; return Math.floor(legal / bpo) + '.' + (legal % bpo); }

function cfgFor(fx, S, target) {
  return { overs: +fx.overs || S.overs, maxWkts: +fx.maxWkts || S.maxWkts, bpo: S.bpo, wide: S.wide, nb: S.nb, target: target == null ? null : target };
}

/* Replays an innings event list into a full state. Events:
   {k:'open',s,n} {k:'bowler',id} {k:'in',id} {k:'swap'} {k:'end'}
   {k:'ball', r, x:'wd'|'nb'|'b'|'lb'|null, xr, w:{type,out,f}} */
function replay(events, cfg) {
  const bpo = cfg.bpo || 6, quota = cfg.overs * bpo;
  const st = { runs: 0, wkts: 0, legal: 0, extras: { wd: 0, nb: 0, b: 0, lb: 0 }, bat: {}, batOrder: [], bowl: {}, bowlOrder: [],
    striker: null, non: null, bowler: null, lastBowler: null, fow: [], log: [], cur: [], overs: [], freeHit: false,
    done: false, reason: '', pRuns: 0, pBalls: 0, ovR: 0, quota, bpo, maxWkts: cfg.maxWkts, target: cfg.target, balls: 0 };
  const B = id => st.bat[id] || (st.batOrder.push(id), st.bat[id] = { id, r: 0, b: 0, f4: 0, f6: 0, out: false, how: '', by: null, fld: null, dots: 0 });
  const W = id => st.bowl[id] || (st.bowlOrder.push(id), st.bowl[id] = { id, balls: 0, runs: 0, w: 0, dots: 0, wd: 0, nb: 0, m: 0 });
  const swap = () => { const t = st.striker; st.striker = st.non; st.non = t; };

  for (const e of events) {
    if (st.done) break;
    if (e.k === 'open') { B(e.s); B(e.n); st.striker = e.s; st.non = e.n; }
    else if (e.k === 'bowler') { st.bowler = e.id; W(e.id); st.ovR = 0; }
    else if (e.k === 'in') { B(e.id); if (st.striker == null) st.striker = e.id; else if (st.non == null) st.non = e.id; st.pRuns = 0; st.pBalls = 0; }
    else if (e.k === 'swap') swap();
    else if (e.k === 'end') { st.done = true; st.reason = 'Innings closed'; }
    else if (e.k === 'ball') {
      if (st.striker == null || st.bowler == null) continue; // malformed, ignore
      const x = e.x || null, legal = !(x === 'wd' || x === 'nb');
      const fh = st.freeHit;
      let bat = 0, total = 0, bowlR = 0, run = 0;
      if (x === 'wd') { run = e.xr || 0; total = cfg.wide + run; bowlR = total; st.extras.wd += total; }
      else if (x === 'nb') { bat = e.r || 0; run = bat; total = cfg.nb + bat; bowlR = total; st.extras.nb += cfg.nb; }
      else if (x === 'b' || x === 'lb') { run = e.xr || 0; total = run; st.extras[x] += run; }
      else { bat = e.r || 0; run = bat; total = bat; bowlR = bat; }
      const s = st.striker, bs = B(s), bw = W(st.bowler);
      const pos = st.legal, ovNo = Math.floor(pos / bpo), bNo = pos % bpo + 1;
      st.runs += total; st.pRuns += total;
      if (x !== 'wd') { bs.b++; st.pBalls++; if (total === 0) bs.dots++; }
      bs.r += bat; if (bat === 4) bs.f4++; if (bat === 6) bs.f6++;
      bw.runs += bowlR; st.ovR += bowlR;
      if (x === 'wd') bw.wd += total; if (x === 'nb') bw.nb++;
      if (legal) { bw.balls++; if (total === 0) bw.dots++; st.legal++; }
      st.balls++;
      if (run % 2 === 1) swap();
      let wk = null;
      if (e.w && !(fh && e.w.type !== 'runout')) {
        const out = e.w.out || s, ob = B(out);
        ob.out = true; ob.how = e.w.type; ob.by = e.w.type === 'runout' ? null : st.bowler; ob.fld = e.w.f || null;
        st.wkts++; if (e.w.type !== 'runout') bw.w++;
        wk = { out, type: e.w.type };
        st.fow.push({ n: st.wkts, runs: st.runs, id: out, ov: ovStr(st.legal, bpo) });
        if (st.striker === out) st.striker = null; else if (st.non === out) st.non = null;
        st.pRuns = 0; st.pBalls = 0;
      }
      const lbl = wk ? 'W' : x === 'wd' ? 'Wd' + (run ? '+' + run : '') : x === 'nb' ? 'Nb' + (bat ? '+' + bat : '') : x === 'b' ? 'B' + run : x === 'lb' ? 'Lb' + run : String(bat);
      const cls = wk ? 'w' : x ? 'x' : bat === 6 ? 's6' : bat === 4 ? 's4' : bat === 0 ? 'dot' : 'r';
      st.cur.push({ lbl, cls });
      st.log.push({ ov: ovNo + '.' + bNo, lbl, cls, total, bat, x, run, striker: s, bowler: st.bowler, wk, fh, legal });
      st.freeHit = x === 'nb' || (fh && x === 'wd');
      if (legal && st.legal % bpo === 0) {
        if (st.ovR === 0) bw.m++;
        st.overs.push({ bowler: st.bowler, runs: st.ovR, balls: st.cur.slice(), no: st.legal / bpo });
        swap(); st.lastBowler = st.bowler; st.bowler = null; st.cur = []; st.ovR = 0;
      }
    }
    if (st.wkts >= cfg.maxWkts) { st.done = true; st.reason = 'All out'; }
    else if (st.legal >= quota) { st.done = true; st.reason = 'Overs complete'; }
    else if (cfg.target != null && st.runs >= cfg.target) { st.done = true; st.reason = 'Target chased'; }
  }
  st.allOut = st.wkts >= cfg.maxWkts;
  st.crr = st.legal ? st.runs / (st.legal / bpo) : 0;
  st.ballsLeft = Math.max(0, quota - st.legal);
  if (cfg.target != null) { st.need = Math.max(0, cfg.target - st.runs); st.rrr = st.ballsLeft ? st.need / (st.ballsLeft / bpo) : 0; }
  st.needBat = !st.done && (st.striker == null || st.non == null) && st.batOrder.length > 0;
  st.needBowler = !st.done && st.bowler == null && st.batOrder.length > 0 && !st.needBat;
  st.needOpen = !st.done && st.batOrder.length === 0;
  return st;
}

function manualSt(m, fx, S) {
  const mw = +fx.maxWkts || S.maxWkts, q = (+fx.overs || S.overs) * S.bpo;
  return { runs: +m.runs || 0, wkts: +m.wkts || 0, legal: +m.balls || 0, done: true, manual: true, maxWkts: mw, quota: q, bpo: S.bpo,
    allOut: (+m.wkts || 0) >= mw, crr: (+m.balls ? (+m.runs || 0) / ((+m.balls) / S.bpo) : 0), ballsLeft: 0, extras: { wd: 0, nb: 0, b: 0, lb: 0 }, bat: {}, batOrder: [], bowl: {}, bowlOrder: [], fow: [], log: [], overs: [], cur: [] };
}

/* Returns [{team, st}] for an innings-based or manually entered fixture */
function getInns(fx, S) {
  const out = [];
  if (fx.manual) {
    ['i1', 'i2'].forEach((k, i) => { const m = fx.manual[k]; if (m) out.push({ team: i ? fx.manual.second : fx.manual.first, st: manualSt(m, fx, S), i }); });
  } else if (fx.inn) {
    fx.inn.forEach((inn, i) => {
      if (i === 1 && (fx.cur || 0) < 1 && !(inn.events && inn.events.length)) return;
      const tgt = i === 1 && out[0] ? out[0].st.runs + 1 : null;
      out.push({ team: inn.team, st: replay(inn.events || [], cfgFor(fx, S, tgt)), i });
    });
  }
  return out;
}

function outcome(fx, S, nm) {
  if (fx.status !== 'completed') return null;
  if (fx.nr) return { nr: true, text: 'No result' };
  if (fx.forceWinner) return { winner: fx.forceWinner, text: fx.forceText || (nm(fx.forceWinner) + ' won') };
  const I = getInns(fx, S);
  if (I.length < 2) return { nr: true, text: 'No result' };

const tlogo = (id, sz) => id && TEAM[id] ? `<img class="lg" style="width:${sz}px;height:${sz}px" src="${LOGOS[id]}" alt="${esc(TEAM[id].name)}">` : `<span class="lg ph" style="width:${sz}px;height:${sz}px">?</span>`;
const tcol = id => TEAM[id] ? TEAM[id].c1 : '#8f9bbd';
const ovs = (l, b) => ovStr(l, b || CFG.bpo);
const sr = (r, b) => b ? (r * 100 / b).toFixed(1) : '0.0';
const econ = (r, b) => b ? (r * CFG.bpo / b).toFixed(2) : '0.00';
const stageName = f => f.stage === 'group' ? 'Group ' + f.group : f.stage === 'sf' ? 'Semi-final' : 'Final';
const oversOf = f => +f.overs || CFG.overs;
function teamSum(f, team) { const I = getInns(f, CFG); const x = I.find(i => i.team === team); return x ? x.st : null; }
function scoreTxt(st) { return st ? st.runs + '/' + st.wkts : '–'; }
function chipFor(f) {
  if (f.status === 'live') return '<span class="chip live"><i></i>LIVE</span>';
  if (f.status === 'completed') return '<span class="chip ft">Completed</span>';
  return '<span class="chip up">Upcoming</span>';
}
function howOut(b) {
  if (!b.out) return 'not out';
  const by = b.by ? pn(b.by) : '', f = b.fld ? pn(b.fld) : '';
  switch (b.how) {
    case 'bowled': return 'b ' + by; case 'caught': return 'c ' + (f || '?') + ' b ' + by; case 'lbw': return 'lbw b ' + by;
    case 'stumped': return 'st ' + (f || '?') + ' b ' + by; case 'runout': return 'run out' + (f ? ' (' + f + ')' : '');
    case 'hitwicket': return 'hit wicket b ' + by; default: return b.how;
  }
}

/* ===================== scorecard ===================== */
function scorecardHTML(f) {
  const I = getInns(f, CFG);
  if (!I.length) return '<p class="mut pad">Scorecard will appear once the match starts.</p>';
  return I.map(x => {
    const st = x.st, opp = I.find(y => y !== x) ? I.find(y => y !== x).team : (x.team === f.ta ? f.tb : f.ta);
    if (st.manual) return `<div class="inn"><div class="inn-h">${tlogo(x.team, 28)}<b>${esc(nmOf(x.team))}</b><span class="big">${st.runs}/${st.wkts}</span><span class="mut">(${ovs(st.legal)} ov)</span></div></div>`;
    const bt = TEAM[x.team] ? TEAM[x.team].pl : [], bw = TEAM[opp] ? TEAM[opp].pl : [];
    const dnb = bt.filter(p => !st.bat[p.id]).map(p => p.name);
    const ex = st.extras, exT = ex.wd + ex.nb + ex.b + ex.lb;
    return `<div class="inn"><div class="inn-h">${tlogo(x.team, 28)}<b>${esc(nmOf(x.team))}</b><span class="big">${st.runs}/${st.wkts}</span><span class="mut">(${ovs(st.legal)} / ${oversOf(f)} ov)</span>${st.done ? '' : '<span class="chip live sm"><i></i>batting</span>'}</div>
    <div class="tw"><table class="t"><thead><tr><th>Batter</th><th></th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>
    ${st.batOrder.map(id => { const b = st.bat[id], on = !st.done && (st.striker === id || st.non === id); return `<tr><td class="nm">${esc(pn(id))}${st.striker === id && !st.done ? ' <span class="star">*</span>' : ''}</td><td class="mut sm2">${on ? 'batting' : esc(howOut(b))}</td><td><b>${b.r}</b></td><td>${b.b}</td><td>${b.f4}</td><td>${b.f6}</td><td>${sr(b.r, b.b)}</td></tr>`; }).join('')}
    <tr class="ex"><td colspan="2">Extras</td><td colspan="5">${exT} <span class="mut">(wd ${ex.wd}, nb ${ex.nb}, b ${ex.b}, lb ${ex.lb})</span></td></tr>
    <tr class="tot"><td colspan="2">Total</td><td colspan="5">${st.runs}/${st.wkts} <span class="mut">(${ovs(st.legal)} ov, RR ${st.crr.toFixed(2)})</span></td></tr></tbody></table></div>
    ${dnb.length ? `<p class="sm2 mut pad2"><b>Did not bat:</b> ${esc(dnb.join(', '))}</p>` : ''}
    ${st.fow.length ? `<p class="sm2 mut pad2"><b>Fall of wickets:</b> ${st.fow.map(w => `${w.n}-${w.runs} (${esc(pn(w.id))}, ${w.ov})`).join(' · ')}</p>` : ''}
    <div class="tw"><table class="t"><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th><th>Wd/Nb</th></tr></thead><tbody>
    ${st.bowlOrder.map(id => { const w = st.bowl[id]; return `<tr><td class="nm">${esc(pn(id))}</td><td>${ovs(w.balls)}</td><td>${w.m}</td><td>${w.runs}</td><td><b>${w.w}</b></td><td>${econ(w.runs, w.balls)}</td><td>${w.wd ? w.wd : 0}/${w.nb}</td></tr>`; }).join('')}
    </tbody></table></div></div>`;
  }).join('');
}

/* ===================== Page: Fixtures ===================== */
function fxCard(f) {
  const sa = f.ta ? teamSum(f, f.ta) : null, sb = f.tb ? teamSum(f, f.tb) : null;
  const oc = outcome(f, CFG, nmOf);
  const row = (id, tok, st) => `<div class="tm ${oc && oc.winner === id ? 'win' : ''}">${tlogo(id, 52)}<div class="tn">${esc(id && TEAM[id] ? TEAM[id].name : tokLabel(tok))}</div><div class="sc">${st ? `<b>${scoreTxt(st)}</b><small>${ovs(st.legal)} ov</small>` : ''}</div></div>`;
  const when = f.status === 'upcoming' ? `${esc(fmtDate(f.date))}${f.time ? ' · ' + esc(fmtRange(f)) : ''}` : '';
  return `<article class="fxc ${f.status}" data-act="match" data-arg="${esc(f.id)}">
    <div class="fxh"><span class="stg">${esc(stageName(f))} · ${esc(f.label)}</span>${chipFor(f)}</div>
    <div class="fxm">${row(f.ta, f.teamA, sa)}<div class="vs">VS</div>${row(f.tb, f.teamB, sb)}</div>
    <div class="fxf">${oc ? `<span class="res">${esc(oc.text)}</span>` : f.status === 'live' ? '<span class="res live">Match in progress — tap for live score</span>' : `<span>${when}</span>`}
    <span class="mut">${esc(f.venue || '')} · ${oversOf(f)} overs</span></div></article>`;
}
function schedHTML() {
  const days = {}; M.fxs.forEach(f => (days[f.date || ''] = days[f.date || ''] || []).push(f));
  return `<h2 class="sh">Match Schedule</h2><div class="card sched">${Object.keys(days).sort().map(d => `<div class="sd">${esc(fmtDate(d))}</div>` + days[d].map(f => `<div class="sr" data-act="match" data-arg="${esc(f.id)}"><span class="stm">${esc(fmtRange(f) || 'TBA')}</span><span class="stn">${esc(f.ta ? nmOf(f.ta) : tokLabel(f.teamA))} <i>vs</i> ${esc(f.tb ? nmOf(f.tb) : tokLabel(f.teamB))}</span><span class="ssg">${esc(f.stage === 'group' ? 'Group ' + f.group : f.label)}</span>${chipFor(f)}</div>`).join('')).join('')}</div>`;
}

  ${live.length ? `<section class="wrap"><div class="banner" data-act="goLive" data-arg="${live[0].id}"><span class="chip live"><i></i>LIVE NOW</span><b>${esc(nmOf(live[0].ta))}</b> ${scoreTxt(teamSum(live[0], live[0].ta))} <span class="mut">vs</span> <b>${esc(nmOf(live[0].tb))}</b> ${scoreTxt(teamSum(live[0], live[0].tb))}<span class="go">Watch live →</span></div></section>` : ''}
  <section class="wrap"><h2 class="sh">The Squads</h2><div class="teams">${TEAMS.map(t => `<button class="tcard" style="--c:${t.c1}" data-act="squad" data-arg="${t.id}">${tlogo(t.id, 92)}<b>${esc(t.name)}</b><small>Group ${GROUPS[t.id]} · ${esc(t.mgr)}</small></button>`).join('')}</div></section>
  <section class="wrap">${schedHTML()}</section>
  <section class="wrap"><h2 class="sh">Fixtures</h2>

    <h3 class="gh"><i class="dot b"></i>Group B</h3><div class="fxg">${grp('B').map(fxCard).join('')}</div>
    <h3 class="gh"><i class="dot k"></i>Semi-finals</h3><div class="fxg">${sf.map(fxCard).join('')}</div>
    <h3 class="gh"><i class="dot f"></i>Grand Final</h3><div class="fxg one">${fin.map(fxCard).join('')}</div></section>`;
}

/* ===================== Page: Points & Stats ===================== */
function pageStandings() {
  const grpTable = g => {
    const rows = M.stand[g] || [], gf = M.fxs.filter(f => f.stage === 'group' && f.group === g), complete = gf.length && gf.every(f => f.status === 'completed');
    return `<div class="card"><h3 class="gh"><i class="dot ${g === 'A' ? 'a' : 'b'}"></i>Group ${g} ${complete ? '<span class="chip ft sm">Final</span>' : ''}</h3><div class="tw"><table class="t pt"><thead><tr><th>#</th><th class="l">Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>NR</th><th>NRR</th><th>Pts</th><th class="hm">Form</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr class="${i < 2 ? 'q' : ''}"><td>${i + 1}</td><td class="l"><span class="tc">${tlogo(r.id, 30)}${esc(nmOf(r.id))}</span></td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.t}</td><td>${r.nr}</td><td>${r.nrr >= 0 ? '+' : ''}${r.nrr.toFixed(3)}</td><td><b class="pts">${r.pts}</b></td><td class="hm">${r.form.slice(-5).map(x => `<i class="fm ${x}">${x}</i>`).join('')}</td></tr>`).join('')}
    </tbody></table></div><p class="note"><i class="qd"></i> Top 2 advance to the semi-finals · Win ${CFG.win} pts · Tie ${CFG.tie} · NR ${CFG.nr} · Ties broken by wins, then NRR</p></div>`;
  };
  const sf = M.fxs.filter(f => f.stage !== 'group');
  const bracket = `<div class="card"><h3 class="gh"><i class="dot k"></i>Road to the Final</h3><div class="bk">
    <div class="bkc">${sf.filter(f => f.stage === 'sf').map(bkm).join('')}</div><div class="bkl">→</div><div class="bkc">${sf.filter(f => f.stage === 'final').map(bkm).join('')}</div></div></div>`;
  function bkm(f) {
    const oc = outcome(f, CFG, nmOf);
    const l = (id, tok) => `<div class="bkt ${oc && oc.winner === id ? 'w' : ''}">${tlogo(id, 26)}<span>${esc(id && TEAM[id] ? TEAM[id].name : tokLabel(tok))}</span></div>`;
    return `<div class="bkm" data-act="match" data-arg="${f.id}"><small>${esc(f.label)} ${f.status === 'live' ? '· <b class="rd">LIVE</b>' : ''}</small>${l(f.ta, f.teamA)}${l(f.tb, f.teamB)}</div>`;
  }
  return `<section class="wrap top"><h2 class="sh big">Points Table</h2><div class="g2">${grpTable('A')}${grpTable('B')}</div>${bracket}</section>
  <section class="wrap"><h2 class="sh big">Tournament Stats</h2>${statsHTML()}</section>`;
}
function statsHTML() {
  const { P, rec } = aggStats(M.fxs, CFG);
  const pl = Object.values(P);
  const tm = id => PLAYERS[id] ? PLAYERS[id].team : null;
  const pcell = id => `<span class="tc">${tlogo(tm(id), 24)}<span>${esc(pn(id))}</span></span>`;
  const bats = pl.filter(p => p.inn > 0).sort((a, b) => b.runs - a.runs || sr(b.runs, b.balls) - sr(a.runs, a.balls));
  const bowls = pl.filter(p => p.bBalls > 0).sort((a, b) => b.w - a.w || (a.bRuns / a.bBalls) - (b.bRuns / b.bBalls));
  if (!bats.length && !bowls.length) return '<div class="empty"><div class="em">🏏</div><b>Stats will light up once the first ball is bowled.</b><p>Orange Cap, Purple Cap, records and more — all updating live.</p></div>';
  const top = (arr, f) => arr.length ? arr.reduce((a, b) => f(b) > f(a) ? b : a) : null;
  const card = (cls, title, p, big, sub) => `<div class="lead ${cls}"><small>${title}</small>${p ? `<div class="lp">${tlogo(tm(p.id), 40)}<div><b>${esc(pn(p.id))}</b><span>${esc(nmOf(tm(p.id)))}</span></div></div><div class="lv">${big}</div><em>${sub}</em>` : '<div class="lv dash">—</div>'}</div>`;
  const oc = top(bats, p => p.runs), pc = top(bowls, p => p.w * 1000 - p.bRuns / Math.max(1, p.bBalls));
  const six = top(bats, p => p.f6), fourM = top(bats, p => p.f4);
  const srs = bats.filter(p => p.balls >= 10).sort((a, b) => sr(b.runs, b.balls) - sr(a.runs, a.balls))[0];
  const eco = bowls.filter(p => p.bBalls >= CFG.bpo).sort((a, b) => a.bRuns / a.bBalls - b.bRuns / b.bBalls)[0];
  const cat = top(pl.filter(p => p.catches > 0), p => p.catches), mom = top(pl.filter(p => p.mom > 0), p => p.mom);
  const fxl = id => { const f = M.fxs.find(x => x.id === id); return f ? esc(f.label) : ''; };
  const rc = (t, v, s) => `<div class="rec"><small>${t}</small><b>${v}</b><span>${s}</span></div>`;
  const R = [];
  if (rec.highTotal) R.push(rc('Highest team total', rec.highTotal.runs + '/' + rec.highTotal.wkts, `${esc(nmOf(rec.highTotal.team))} · ${fxl(rec.highTotal.fx)}`));
  if (rec.lowTotal) R.push(rc('Lowest team total', rec.lowTotal.runs + '/' + rec.lowTotal.wkts, `${esc(nmOf(rec.lowTotal.team))} · ${fxl(rec.lowTotal.fx)}`));
  if (rec.highChase) R.push(rc('Highest run chase', rec.highChase.runs + ' target', `${esc(nmOf(rec.highChase.team))} · ${fxl(rec.highChase.fx)}`));
  if (rec.bigRuns) R.push(rc('Biggest win (runs)', rec.bigRuns.margin + ' runs', `${esc(nmOf(rec.bigRuns.team))} v ${esc(nmOf(rec.bigRuns.opp))}`));
  if (rec.bigWkts) R.push(rc('Biggest win (wickets)', rec.bigWkts.margin + ' wkts', `${esc(nmOf(rec.bigWkts.team))} v ${esc(nmOf(rec.bigWkts.opp))}`));
  if (rec.hs) R.push(rc('Highest individual score', rec.hs.r + (rec.hs.no ? '*' : '') + ' (' + rec.hs.b + ')', `${esc(pn(rec.hs.id))} · ${fxl(rec.hs.fx)}`));
  if (rec.bestBowl) R.push(rc('Best bowling figures', rec.bestBowl.w + '/' + rec.bestBowl.r, `${esc(pn(rec.bestBowl.id))} · ${fxl(rec.bestBowl.fx)}`));
  if (rec.sixesInn && rec.sixesInn.n) R.push(rc('Most sixes in an innings', rec.sixesInn.n, `${esc(nmOf(rec.sixesInn.team))} · ${fxl(rec.sixesInn.fx)}`));
  const tabs = [['bat', 'Batting'], ['bowl', 'Bowling'], ['team', 'Teams'], ['field', 'Fielding & Awards']];
  const tbl = {
    bat: `<table class="t"><thead><tr><th>#</th><th class="l">Batter</th><th>Inn</th><th>Runs</th><th>Balls</th><th>SR</th><th>4s</th><th>6s</th><th>HS</th><th>30+</th></tr></thead><tbody>${bats.map((p, i) => `<tr><td>${i + 1}</td><td class="l">${pcell(p.id)}</td><td>${p.inn}</td><td><b>${p.runs}</b></td><td>${p.balls}</td><td>${sr(p.runs, p.balls)}</td><td>${p.f4}</td><td>${p.f6}</td><td>${p.hs}${p.hsNo ? '*' : ''}</td><td>${p.t30}</td></tr>`).join('')}</tbody></table>`,
    bowl: `<table class="t"><thead><tr><th>#</th><th class="l">Bowler</th><th>Inn</th><th>Ov</th><th>Runs</th><th>Wkts</th><th>Econ</th><th>Best</th><th>Dots</th><th>Mdn</th></tr></thead><tbody>${bowls.map((p, i) => `<tr><td>${i + 1}</td><td class="l">${pcell(p.id)}</td><td>${p.binn}</td><td>${ovs(p.bBalls)}</td><td>${p.bRuns}</td><td><b>${p.w}</b></td><td>${econ(p.bRuns, p.bBalls)}</td><td>${p.best ? p.best.w + '/' + p.best.r : '-'}</td><td>${p.bDots}</td><td>${p.m}</td></tr>`).join('')}</tbody></table>`,
    team: `<table class="t"><thead><tr><th class="l">Team</th><th>Sixes</th><th>Fours</th><th>P</th><th>W</th><th>NRR</th></tr></thead><tbody>${TEAMS.map(t => { const r = (M.stand[GROUPS[t.id]] || []).find(x => x.id === t.id) || {}; return { t, r, s: rec.teamSix[t.id] || 0, f: rec.teamFour[t.id] || 0 }; }).sort((a, b) => b.s - a.s).map(o => `<tr><td class="l"><span class="tc">${tlogo(o.t.id, 26)}${esc(o.t.name)}</span></td><td><b>${o.s}</b></td><td>${o.f}</td><td>${o.r.p || 0}</td><td>${o.r.w || 0}</td><td>${o.r.nrr != null ? (o.r.nrr >= 0 ? '+' : '') + o.r.nrr.toFixed(3) : '0.000'}</td></tr>`).join('')}</tbody></table>`,
    field: `<table class="t"><thead><tr><th class="l">Player</th><th>Catches</th><th>Run-outs</th><th>Stumpings</th><th>Player of Match</th></tr></thead><tbody>${pl.filter(p => p.catches || p.runouts || p.stumps || p.mom).sort((a, b) => (b.mom - a.mom) || (b.catches + b.runouts + b.stumps) - (a.catches + a.runouts + a.stumps)).map(p => `<tr><td class="l">${pcell(p.id)}</td><td>${p.catches}</td><td>${p.runouts}</td><td>${p.stumps}</td><td>${p.mom ? '🏅 ' + p.mom : '–'}</td></tr>`).join('') || '<tr><td colspan="5" class="mut">No entries yet</td></tr>'}</tbody></table>`
  };
  return `<div class="leads">
    ${card('orange', '🟠 Orange Cap · Most runs', oc, oc ? oc.runs : '', oc ? `${oc.inn} inn · SR ${sr(oc.runs, oc.balls)} · HS ${oc.hs}${oc.hsNo ? '*' : ''}` : '')}
    ${card('purple', '🟣 Purple Cap · Most wickets', pc && pc.w ? pc : null, pc ? pc.w : '', pc ? `Econ ${econ(pc.bRuns, pc.bBalls)} · Best ${pc.best ? pc.best.w + '/' + pc.best.r : '-'}` : '')}
    ${card('gold', 'Most sixes', six && six.f6 ? six : null, six ? six.f6 : '', six ? `${six.runs} runs` : '')}
    ${card('blue', 'Most fours', fourM && fourM.f4 ? fourM : null, fourM ? fourM.f4 : '', fourM ? `${fourM.runs} runs` : '')}
    ${card('red', 'Best strike rate (min 10 balls)', srs, srs ? sr(srs.runs, srs.balls) : '', srs ? `${srs.runs} off ${srs.balls}` : '')}
    ${card('green', 'Best economy (min 1 over)', eco, eco ? econ(eco.bRuns, eco.bBalls) : '', eco ? `${ovs(eco.bBalls)} ov · ${eco.w} wkts` : '')}
    ${card('teal', 'Most catches', cat, cat ? cat.catches : '', '')}
    ${card('pink', 'Most Player-of-the-Match', mom, mom ? mom.mom : '', '')}
  </div>
  ${R.length ? `<h3 class="gh mt"><i class="dot k"></i>Records</h3><div class="recs">${R.join('')}</div>` : ''}
  <div class="tabs sub" role="tablist">${tabs.map(([k, n]) => `<button class="${ui.statTab === k ? 'on' : ''}" data-act="statTab" data-arg="${k}">${n}</button>`).join('')}</div>
  <div class="card tw">${tbl[ui.statTab]}</div>`;
}

/* ===================== Page: Live ===================== */
function pageLive() {
  const cand = M.fxs.filter(f => f.status !== 'upcoming' || (f.ta && f.tb));
  const order = [...M.fxs.filter(f => f.status === 'live'), ...M.fxs.filter(f => f.status === 'upcoming' && f.ta && f.tb), ...M.fxs.filter(f => f.status === 'completed').reverse()];
  let f = M.fxs.find(x => x.id === ui.liveSel) || order[0];
  const chips = `<div class="chips">${order.map(o => `<button class="mc ${f && o.id === f.id ? 'on' : ''}" data-act="liveSel" data-arg="${o.id}">${o.status === 'live' ? '<i class="ld"></i>' : ''}${esc(o.label)}<small>${esc(o.ta ? TEAM[o.ta].name : tokLabel(o.teamA))} v ${esc(o.tb ? TEAM[o.tb].name : tokLabel(o.teamB))}</small></button>`).join('')}</div>`;
  if (!f) return `<section class="wrap top">${chips}<div class="empty"><b>No matches yet.</b></div></section>`;
  const I = getInns(f, CFG), oc = outcome(f, CFG, nmOf);
  let head;
  if (!I.length) {
    head = `<div class="sb"><div class="sbt">${chipFor(f)}<span>${esc(stageName(f))} · ${esc(f.label)}</span></div>
      <div class="sbm"><div class="sbteam">${tlogo(f.ta, 84)}<b>${esc(f.ta ? nmOf(f.ta) : tokLabel(f.teamA))}</b></div><div class="vs big">VS</div><div class="sbteam">${tlogo(f.tb, 84)}<b>${esc(f.tb ? nmOf(f.tb) : tokLabel(f.teamB))}</b></div></div>

      <div class="sbs"><div class="runs">${st.runs}<span>/${st.wkts}</span></div><div class="ovl">${ovs(st.legal)} <small>/ ${oversOf(f)} ov</small></div><div class="crr">CRR ${st.crr.toFixed(2)}</div></div>

      ${line}

      ${bat.map(id => { const b = st.bat[id]; return `<tr><td class="l">${esc(pn(id))}${st.striker === id ? ' <span class="star">*</span>' : ''}</td><td><b>${b.r}</b></td><td>${b.b}</td><td>${b.f4}</td><td>${b.f6}</td><td>${sr(b.r, b.b)}</td></tr>`; }).join('') || '<tr><td colspan="6" class="mut">Waiting for batters…</td></tr>'}

function commentary(l) {
  const a = esc(pn(l.bowler)), b = esc(pn(l.striker));
  let t;
  if (l.wk) { const h = { bowled: 'BOWLED!', caught: 'CAUGHT!', lbw: 'LBW!', stumped: 'STUMPED!', runout: 'RUN OUT!', hitwicket: 'HIT WICKET!' }[l.wk.type] || 'OUT!'; t = `<b class="rd">WICKET — ${h}</b> ${esc(pn(l.wk.out))} departs.`; }
  else if (l.x === 'wd') t = 'Wide' + (l.run ? ' and ' + l.run + ' run' + (l.run > 1 ? 's' : '') : '') + '.';
  else if (l.x === 'nb') t = 'No ball' + (l.bat ? ', ' + (l.bat === 4 ? 'FOUR' : l.bat === 6 ? 'SIX' : l.bat + ' run' + (l.bat > 1 ? 's' : '')) : '') + '! Free hit next.';
  else if (l.x === 'b' || l.x === 'lb') t = (l.x === 'b' ? 'Byes' : 'Leg byes') + ', ' + l.run + '.';
  else t = l.bat === 6 ? '<b class="gd">SIX!</b> Cleared the box.' : l.bat === 4 ? '<b class="gd">FOUR!</b> Races away.' : l.bat === 0 ? 'Dot ball.' : l.bat + ' run' + (l.bat > 1 ? 's' : '') + '.';
  return `${a} to ${b} — ${t}`;
}

  if (m.type === 'squad') {
    const t = TEAM[m.id], spent = t.players.reduce((a, p) => a + p.price, 0);
    inner = `<div class="mh" style="--c:${t.c1}">${tlogo(t.id, 110)}<div><h2>${esc(t.name)}</h2><p class="mut">Team Manager: <b>${esc(t.mgr)}</b> · Group ${GROUPS[t.id]}</p><p class="tagl">“${esc(t.tag)}”</p><p class="mut sm2">Spent ${fmtPrice(spent)} · Purse left ${fmtPrice(t.left)}</p></div></div>
      <div class="tw"><table class="t sq"><thead><tr><th>#</th><th class="l">Player</th><th>Role</th><th>Auction price</th></tr></thead><tbody>${t.pl.map(p => `<tr><td>${p.no}</td><td class="l">${esc(p.name)}</td><td><span class="rl ${p.cat}">${CAT[p.cat]}</span></td><td>${fmtPrice(p.price)}</td></tr>`).join('')}</tbody></table></div>`;
  } else if (m.type === 'match') {
    const f = M.fxs.find(x => x.id === m.id); if (!f) return '';
    const oc = outcome(f, CFG, nmOf);
    inner = `<div class="mh"><div class="mm">${tlogo(f.ta, 64)}<b>${esc(f.ta ? nmOf(f.ta) : tokLabel(f.teamA))}</b><span class="mut">vs</span><b>${esc(f.tb ? nmOf(f.tb) : tokLabel(f.teamB))}</b>${tlogo(f.tb, 64)}</div></div>
      <p class="center mut">${esc(stageName(f))} · ${esc(f.label)} · ${esc(fmtDate(f.date))}${f.time ? ' · ' + esc(fmtRange(f)) : ''} · ${esc(f.venue || '')}</p>
      ${oc ? `<div class="resb">${esc(oc.text)}</div>` : ''}${f.mom && f.status === 'completed' ? `<div class="mom">🏅 Player of the Match: <b>${esc(pn(f.mom))}</b></div>` : ''}
      ${f.status === 'live' ? `<div class="btns c"><button class="btn gold" data-act="goLive" data-arg="${f.id}">Open live centre</button></div>` : ''}
      ${scorecardHTML(f)}`;
  } else if (m.type === 'wicket') {
    const f = M.fxs.find(x => x.id === m.id), I = getInns(f, CFG), cur = I.find(x => x.i === (f.cur || 0)), st = cur.st, bl = f.inn.find(n => n.team !== cur.team).team;
    const w = ui.wk, x = w.x, fh = st.freeHit;
    const types = [['bowled', 'Bowled'], ['caught', 'Caught'], ['lbw', 'LBW'], ['stumped', 'Stumped'], ['runout', 'Run out'], ['hitwicket', 'Hit wicket']].filter(([k]) => (fh || x === 'nb') ? k === 'runout' : x === 'wd' ? ['stumped', 'runout', 'hitwicket'].includes(k) : (x === 'b' || x === 'lb') ? ['runout'].includes(k) : true);
    if (!types.find(t => t[0] === w.type)) w.type = types[0][0];
    inner = `<h2>Wicket</h2>${fh || x === 'nb' ? '<p class="warn">Free hit / no-ball: only a run-out counts.</p>' : ''}<div class="form">
      <div class="row"><label>Ball type</label><select data-chg="wkx">${[['', 'Legal ball'], ['wd', 'Wide'], ['nb', 'No ball'], ['b', 'Bye'], ['lb', 'Leg bye']].map(([k, n]) => `<option value="${k}" ${x === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      <div class="row"><label>How out</label><select data-chg="wkt">${types.map(([k, n]) => `<option value="${k}" ${w.type === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      ${w.type === 'runout' ? `<div class="row"><label>Who is out</label><select data-chg="wko"><option value="${st.striker}" ${w.out !== st.non ? 'selected' : ''}>${esc(pn(st.striker))} (striker)</option><option value="${st.non}" ${w.out === st.non ? 'selected' : ''}>${esc(pn(st.non))} (non-striker)</option></select></div>` : ''}
      ${['caught', 'stumped', 'runout'].includes(w.type) ? `<div class="row"><label>${w.type === 'caught' ? 'Caught by' : w.type === 'stumped' ? 'Stumped by' : 'Fielder (optional)'}</label><select data-chg="wkf">${playerOpts(bl, w.f, [], w.type === 'runout' ? 'Not recorded' : 'Select fielder')}</select></div>` : ''}
      <div class="row"><label>Runs completed before the wicket</label><select data-chg="wkr">${[0, 1, 2, 3].map(n => `<option ${+w.runs === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
      <div class="btns"><button class="btn red" data-act="wicketOK" data-arg="${f.id}">Confirm wicket</button><button class="btn ghost" data-act="close">Cancel</button></div>`;
  } else if (m.type === 'complete') {
    const f = M.fxs.find(x => x.id === m.id), oc = outcome({ ...f, status: 'completed' }, CFG, nmOf), pl = [...(TEAM[f.ta] ? TEAM[f.ta].pl : []), ...(TEAM[f.tb] ? TEAM[f.tb].pl : [])];
    inner = `<h2>Complete match</h2>${oc ? `<div class="resb">${esc(oc.text)}</div>` : ''}<div class="form">
      ${oc && oc.tie && !oc.winner ? `<div class="row"><label>Tie-break (Super Over) winner</label><select id="sw"><option value="">Leave as tie</option><option value="${f.ta}">${esc(nmOf(f.ta))}</option><option value="${f.tb}">${esc(nmOf(f.tb))}</option></select></div>` : ''}
      <div class="row"><label>Player of the Match</label><select id="mom"><option value="">None</option>${pl.map(p => `<option value="${p.id}" ${f.mom === p.id ? 'selected' : ''}>${esc(p.name)} (${esc(nmOf(p.team))})</option>`).join('')}</select></div></div>
      <div class="btns"><button class="btn gold" data-act="completeOK" data-arg="${f.id}">Confirm & publish result</button><button class="btn ghost" data-act="close">Cancel</button></div>`;
  } else if (m.type === 'manual') {
    const f = M.fxs.find(x => x.id === m.id), mn = f.manual || {};
    const blk = (k, team) => `<div class="mrow"><b>${esc(nmOf(team))}</b><input id="${k}r" type="number" min="0" placeholder="Runs" value="${mn[k] ? mn[k].runs : ''}"><input id="${k}w" type="number" min="0" placeholder="Wkts" value="${mn[k] ? mn[k].wkts : ''}"><input id="${k}b" type="number" min="0" placeholder="Balls faced" value="${mn[k] ? mn[k].balls : ''}"></div>`;
    inner = `<h2>Enter result manually</h2><p class="mut">Use this when a match wasn’t scored ball-by-ball. Runs/wickets/balls feed the points table and NRR.</p>
      <div class="row"><label>Batted first</label><select id="mf"><option value="${f.ta}">${esc(nmOf(f.ta))}</option><option value="${f.tb}" ${mn.first === f.tb ? 'selected' : ''}>${esc(nmOf(f.tb))}</option></select></div>
      ${blk('i1', 'First innings')}${blk('i2', 'Second innings')}
      <div class="btns"><button class="btn gold" data-act="manualOK" data-arg="${f.id}">Save result</button><button class="btn ghost" data-act="close">Cancel</button></div>`;
  }
  return `<div class="ov" data-act="closeBg"><div class="modal" role="dialog"><button class="x" data-act="close" aria-label="Close">×</button>${inner}</div></div>`;
}

/* ===================== Actions ===================== */
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
function evPush(id, ev) { mut(id, f => { const i = f.cur || 0; f.inn[i].events.push(ev); }); }
function curState(id) { const f = M.fxs.find(x => x.id === id); const I = getInns(f, CFG); const c = I.find(x => x.i === (f.cur || 0)); return { f, c }; }
function undo(id) {
  mut(id, f => { const ev = f.inn[f.cur || 0].events; while (ev.length) { const e = ev.pop(); if (e.k === 'ball') break; if (e.k === 'open') { ev.push(e); break; } } });
}
const ACT = {
  login: () => {
    if (MODE === 'server') {
      const pin = val('lgP'); ui.loginErr = '';
      fetch('/api/login', { method: 'POST', headers: { 'x-pin': pin } }).then(r => { if (r.ok) { SRV_PIN = pin; canEdit = true; try { sessionStorage.setItem('sslpin', pin); } catch (e) {} } else ui.loginErr = 'Wrong PIN'; render(); }).catch(() => { ui.loginErr = 'Could not reach the server'; render(); });
      return;
    }
    ui.loginErr = ''; fbAuth.signInWithEmailAndPassword(val('lgE').trim(), val('lgP')).catch(er => { ui.loginErr = 'Sign-in failed: ' + (String(er.code || er.message || er).replace('auth/', '').replace(/-/g, ' ')); render(); }); },
  logout: () => { if (MODE === 'server') { SRV_PIN = ''; canEdit = false; try { sessionStorage.removeItem('sslpin'); } catch (e) {} } else if (fbAuth) fbAuth.signOut(); },
  match: a => { ui.modal = { type: 'match', id: a }; },
  squad: a => { ui.modal = { type: 'squad', id: a }; },
  close: () => { ui.modal = null; },
  closeBg: (a, e) => { if (e.target.classList.contains('ov')) ui.modal = null; },
  goLive: a => { ui.liveSel = a; ui.modal = null; go('live'); },
  liveSel: a => { ui.liveSel = a; }, liveTab: a => { ui.liveTab = a; }, statTab: a => { ui.statTab = a; },
  ctlTab: a => { ui.ctlTab = a; ui.confirm = null; }, extra: a => { ui.extra = a; },
  startMatch: id => {
    const f = M.fxs.find(x => x.id === id), win = val('tw'), el = val('te');
    const first = el === 'bat' ? win : (win === f.ta ? f.tb : f.ta), second = first === f.ta ? f.tb : f.ta;
    mut(id, x => { x.status = 'live'; x.toss = { winner: win, elect: el }; x.overs = Math.max(1, +val('to') || CFG.overs); x.maxWkts = Math.max(1, +val('tk') || CFG.maxWkts); x.cur = 0; x.inn = [{ team: first, events: [] }, { team: second, events: [] }]; delete x.manual; delete x.nr; delete x.forceWinner; });
    ui.liveSel = id;
  },
  openInn: id => {
    const s = val('o1'), n = val('o2'), b = val('o3'); if (!s || !n || !b) return toast('Pick both openers and the bowler'); if (s === n) return toast('Striker and non-striker must differ');
    mut(id, f => { const ev = f.inn[f.cur || 0].events; ev.push({ k: 'open', s, n }, { k: 'bowler', id: b }); }); return 'done';
  },
  newBat: id => { const b = val('nb'); if (!b) return toast('Select the new batter'); evPush(id, { k: 'in', id: b }); return 'done'; },
  newBowler: id => { const b = val('nbw'); if (!b) return toast('Select the bowler'); evPush(id, { k: 'bowler', id: b }); return 'done'; },
  run: arg => {
    const [id, n] = arg.split('|'), r = +n, x = ui.extra; ui.extra = '';
    const e = { k: 'ball' }; if (x === 'wd') { e.x = 'wd'; e.xr = r; } else if (x === 'nb') { e.x = 'nb'; e.r = r; } else if (x === 'b' || x === 'lb') { e.x = x; e.xr = r; } else e.r = r;
    evPush(id, e); return 'done';
  },
  swap: id => evPush(id, { k: 'swap' }),
  undo: id => undo(id),
  endInn: id => evPush(id, { k: 'end' }),
  nextInn: id => mut(id, f => { f.cur = 1; }),
  wicketModal: id => { ui.wk = { type: 'bowled', out: '', f: '', runs: 0, x: ui.extra }; ui.modal = { type: 'wicket', id }; },
  wicketOK: id => {
    const w = ui.wk, { c } = curState(id), st = c.st;
    if (['caught', 'stumped'].includes(w.type) && !w.f) return toast('Select the fielder');
    const out = w.type === 'runout' ? (w.out || st.striker) : st.striker, e = { k: 'ball', w: { type: w.type, out, f: w.f || null } };
    const r = +w.runs || 0; if (w.x === 'wd') { e.x = 'wd'; e.xr = r; } else if (w.x === 'nb') { e.x = 'nb'; e.r = r; } else if (w.x === 'b' || w.x === 'lb') { e.x = w.x; e.xr = r; } else e.r = r;
    ui.extra = ''; ui.modal = null; evPush(id, e); return 'done';
  },
  completeModal: id => { ui.modal = { type: 'complete', id }; },
  completeOK: id => { const mom = val('mom'), sw = val('sw'); ui.modal = null; mut(id, f => { f.status = 'completed'; f.mom = mom || null; if (sw) f.superWinner = sw; else delete f.superWinner; }); ui.liveSel = id; },
  reopen: id => mut(id, f => { f.status = 'live'; }),
  abandon: id => { if (ui.confirm !== 'ab' + id) { ui.confirm = 'ab' + id; return; } ui.confirm = null; mut(id, f => { f.status = 'completed'; f.nr = true; }); },
  manualRes: id => { ui.modal = { type: 'manual', id }; },
  manualOK: id => {
    const f = M.fxs.find(x => x.id === id), first = val('mf'), second = first === f.ta ? f.tb : f.ta;
    const g = k => ({ runs: +val(k + 'r') || 0, wkts: +val(k + 'w') || 0, balls: +val(k + 'b') || 0 });
    ui.modal = null; mut(id, x => { x.manual = { first, second, i1: g('i1'), i2: g('i2') }; x.status = 'completed'; delete x.inn; delete x.nr; delete x.forceWinner; });
  },
  addFx: () => { const raw = rawFixtures(), ord = Math.max(0, ...raw.map(f => f.ord || 0)) + 1, id = 'x' + Date.now().toString(36); saveFx({ id, ord, stage: 'group', group: 'A', label: 'Match ' + ord, teamA: 'kaal', teamB: 'gada', date: '', time: '', venue: 'Box Cricket Arena, IIM Rohtak', overs: 0, maxWkts: 0, status: 'upcoming' }); },
  delFx: id => { if (ui.confirm !== 'del' + id) { ui.confirm = 'del' + id; return; } ui.confirm = null; saveFx({ id, deleted: true, ord: 0 }); },
  regen: () => {
    if (ui.confirm !== 'regen') { ui.confirm = 'regen'; return; } ui.confirm = null;
    const raw = rawFixtures();
    if (raw.some(f => f.stage === 'group' && f.status !== 'upcoming')) return toast('Some group matches have started — edit them individually instead');
    raw.filter(f => f.stage === 'group').forEach(f => saveFx({ id: f.id, deleted: true, ord: 0 }));
    let ord = 0; const pairs = []; ['A', 'B'].forEach(g => { const t = TEAMS.filter(x => GROUPS[x.id] === g).map(x => x.id); for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++) pairs.push([g, t[i], t[j]]); });
    const A = pairs.filter(p => p[0] === 'A'), B = pairs.filter(p => p[0] === 'B'), mix = []; for (let i = 0; i < Math.max(A.length, B.length); i++) { if (A[i]) mix.push(A[i]); if (B[i]) mix.push(B[i]); }
    mix.forEach(p => { ord++; saveFx({ id: 'g' + ord, ord, stage: 'group', group: p[0], label: 'Match ' + ord, teamA: p[1], teamB: p[2], date: '', time: '', venue: 'Box Cricket Arena, IIM Rohtak', overs: 0, maxWkts: 0, status: 'upcoming' }); });
    raw.filter(f => f.stage !== 'group').forEach(f => { f.ord = (f.ord || 0) + 100; saveFx(f); });
    toast('Group fixtures regenerated');
  },
  import: () => {
    try { const o = JSON.parse(val('imp')); if (o.config) { REMOTE_CFG = o.config; applyCfg(); saveCfg(); } (o.fixtures || []).forEach(f => { delete f.ta; delete f.tb; saveFx(f); }); toast('Backup imported'); } catch (e) { toast('That JSON could not be read'); }
  }
};
function onClick(ev) {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; if (!ACT[a]) return;
  if (a === 'closeBg' && ev.target !== el) return;
  const r = ACT[a](el.dataset.arg, ev);
  render();
}
function onChange(ev) {
  const t = ev.target;
  if (t.dataset.chg) {
    const k = t.dataset.chg;
    if (k === 'ctlSel') ui.ctlSel = t.value;
    else if (k === 'wkx') ui.wk.x = t.value; else if (k === 'wkt') ui.wk.type = t.value; else if (k === 'wko') ui.wk.out = t.value; else if (k === 'wkf') ui.wk.f = t.value; else if (k === 'wkr') ui.wk.runs = +t.value;
    render();
  } else if (t.dataset.fx) {
    const f = t.dataset.f; let v = t.value; if (['overs', 'maxWkts', 'ord'].includes(f)) v = +v || 0;
    mut(t.dataset.fx, x => { x[f] = v; });
  } else if (t.dataset.grp) {
    REMOTE_CFG = REMOTE_CFG || {}; REMOTE_CFG.groups = { ...GROUPS, [t.dataset.grp]: t.value }; applyCfg(); saveCfg(); render();
  } else if (t.dataset.set) {
    REMOTE_CFG = REMOTE_CFG || {}; REMOTE_CFG.set = { ...(REMOTE_CFG.set || {}), [t.dataset.set]: Math.max(0, +t.value || 0) }; applyCfg(); saveCfg(); render();
  }
}

/* ===================== Router & render ===================== */
const PAGES = { fixtures: pageFixtures, standings: pageStandings, live: pageLive, control: pageControl };
function go(p) { if (location.hash !== '#' + p) location.hash = p; else render(); }
function route() { const h = (location.hash || '').slice(1); ui.page = PAGES[h] ? h : 'fixtures'; window.scrollTo(0, 0); render(); }
function render() {
  M = model();
  const keep = window.scrollY;
  $('#app').innerHTML = PAGES[ui.page]();
  $('#modal').innerHTML = modalHTML();
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === ui.page));
  const lv = M.fxs.some(f => f.status === 'live'); $('#navlive').classList.toggle('pulse', lv);
  document.body.classList.toggle('modal-open', !!ui.modal);
  if (ui.page === 'control') window.scrollTo(0, keep);
  paintLink();
}
document.addEventListener('click', onClick);
document.addEventListener('change', onChange);
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.modal) { ui.modal = null; render(); } if (e.key === 'Enter' && e.target && e.target.id === 'lgP') ACT.login(); });
applyCfg(); route(); initDb();

</script>
</body>
